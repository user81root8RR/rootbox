name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Fetch proot binaries
        run: sudo apt-get update && sudo apt-get install -y patchelf binutils xz-utils && bash scripts/fetch_proot.sh
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: rootbox-apk, path: app/build/outputs/apk/debug/app-debug.apk }
